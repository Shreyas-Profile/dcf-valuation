# Cloudflare Pages config.
# Only the public/ folder is uploaded as the website. Secrets (.dev.vars) and code outside public/
# must never be served, so never deploy "." — always deploy public/ (the default below).
name = "dcf-valuation"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
# Public "Sign in with Google" client ID (not a secret).
GOOGLE_CLIENT_ID = "723959219542-3631kod03u6qo53512191cglen2uehac.apps.googleusercontent.com"

# Accounts and saved valuations. Create once with: npx wrangler d1 create dcf-valuation
# then paste the database_id it prints below. Tables are created automatically on first use.
[[d1_databases]]
binding = "DB"
database_name = "dcf-valuation"
database_id = "00000000-0000-0000-0000-000000000000"
