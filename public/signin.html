<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · DCF Sandbox</title>
<meta name="description" content="Sign in to save your valuations and continue them on any device.">
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=1">
<style>
  .wrap { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 30px 16px 60px; }
  .home-link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; margin-bottom: 18px; }
  .card { padding: 26px 22px; }
  .icon { width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 16px; }
  h1 { white-space: normal; font-size: 24px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin: 8px 0 20px; }
  #gbtn { min-height: 44px; }
  .perks { list-style: none; margin-top: 20px; display: grid; gap: 8px; }
  .perks li { display: flex; gap: 10px; font-size: 14px; color: #c9ced6; }
  .perks li::before { content: "✓"; color: var(--accent); font-weight: 700; }
  .msg { font-size: 13px; margin-top: 12px; }
  .msg.err { color: var(--down); }
  .fine { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="app wrap">
  <a class="home-link" href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Home</a>
  <div class="card">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
    <h1 id="title">Sign in or sign up</h1>
    <p class="sub" id="sub">Use your Google account. If you're new, this creates your DCF Sandbox account.</p>
    <div id="gbtn"></div>
    <p class="msg" id="msg" hidden></p>
    <ul class="perks">
      <li>Save your valuations</li>
      <li>Continue where you left off, on any device</li>
      <li>Start as many new ones as you like</li>
    </ul>
  </div>
  <p class="fine">We only use your name, email and profile picture to run your account.</p>
</div>

<script type="module">
import { getMe, googleButton, esc } from "/js/account.js?v=1";
const $ = (id) => document.getElementById(id);
const raw = new URLSearchParams(location.search).get("next") || "/";
// Only go back to pages on this site.
const next = raw.startsWith("/") && !raw.startsWith("//") && !raw.includes("\\") ? raw : "/";

const me = await getMe();
if (me) {
  $("title").textContent = "You're signed in";
  $("sub").innerHTML = `Signed in as <b>${esc(me.email)}</b>. Taking you back…`;
  location.replace(next);
} else {
  googleButton($("gbtn"), (user) => {
    $("msg").hidden = false;
    $("msg").className = "msg";
    $("msg").textContent = `Welcome, ${user.name}! Taking you back…`;
    location.replace(next);
  }, (m) => { $("msg").hidden = false; $("msg").className = "msg err"; $("msg").textContent = m; });
}
</script>
</body>
</html>
